<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Constructor</title>
    <!-- Подключаем Tailwind CSS для стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Стили для кастомного скроллбара и скрытия маркера <details> в Safari/Chrome */
        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #171717; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b; 
        }
    </style>
</head>
<body class="bg-neutral-900 text-gray-200 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: НАСТРОЙКИ -->
        <div class="space-y-6">
            <div class="flex items-center gap-3 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <h1 class="text-2xl font-bold text-white">Class Constructor</h1>
            </div>

            <!-- Основная информация -->
            <details class="bg-neutral-800/50 rounded-lg border border-neutral-700 overflow-hidden" open>
                <summary class="px-4 py-3 flex justify-between items-center bg-neutral-800 cursor-pointer select-none font-semibold text-white text-sm">
                    Основная информация
                    <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </summary>
                <div class="p-4 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Namespace</label>
                        <input type="text" id="namespace" value="PluginExample" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Название Класса (в коде)</label>
                        <input type="text" id="className" value="CustomClass" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Отображаемое Имя (с HTML)</label>
                        <input type="text" id="displayName" value="<b>Уборщик</b>" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none">
                    </div>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="block text-xs text-gray-400 mb-1">Ключ HP (Config)</label>
                            <input type="text" id="configHpKey" value="janitor_health" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none">
                        </div>
                        <div class="w-24">
                            <label class="block text-xs text-gray-400 mb-1">HP (умолч.)</label>
                            <input type="number" id="defaultHp" value="100" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none">
                        </div>
                    </div>
                </div>
            </details>

            <!-- Отображение и Цвет -->
            <details class="bg-neutral-800/50 rounded-lg border border-neutral-700 overflow-hidden" open>
                <summary class="px-4 py-3 flex justify-between items-center bg-neutral-800 cursor-pointer select-none font-semibold text-white text-sm">
                    Отображение (ShowClass) & Цвет
                    <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </summary>
                <div class="p-4">
                    <div class="flex flex-col md:flex-row gap-4 mb-4">
                        <div class="flex-1">
                            <label class="block text-xs text-gray-400 mb-1">HEX Цвет</label>
                            <div class="flex gap-2">
                                <input type="color" id="hexColorPicker" value="#fb00ff" class="h-10 w-12 rounded border-none cursor-pointer bg-neutral-800 p-0">
                                <input type="text" id="hexColorText" value="#fb00ff" class="flex-1 bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none uppercase">
                            </div>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-gray-400 mb-1">Категория</label>
                            <input type="text" id="category" value="Administration" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none">
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-gray-400 mb-1">Иконка</label>
                            <input type="text" id="icon" value="ScientistIcon" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none">
                        </div>
                    </div>
                    <label class="block text-xs text-gray-400 mb-1">Описание (используйте \n для переноса)</label>
                    <textarea id="description" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none min-h-[80px]">Убирайте комплекс.\nПомогайте ученым.</textarea>
                </div>
            </details>

            <!-- Спавн, Модель и Команда -->
            <details class="bg-neutral-800/50 rounded-lg border border-neutral-700 overflow-hidden" open>
                <summary class="px-4 py-3 flex justify-between items-center bg-neutral-800 cursor-pointer select-none font-semibold text-white text-sm">
                    Спавн, Модель и Команда
                    <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </summary>
                <div class="p-4 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Модель Игрока</label>
                        <select id="modelSelect" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none"></select>
                    </div>
                    <div class="flex flex-col justify-center mt-4">
                        <span class="text-xs text-gray-500">Рэгдолл: <b id="ragdollPreview" class="text-purple-400 font-mono">ply_scientist_ragdoll</b></span>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Точка Спавна</label>
                        <select id="spawnPointSelect" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Team ID</label>
                        <select id="teamIdSelect" class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm focus:border-purple-500 outline-none"></select>
                    </div>
                </div>
            </details>

            <!-- Голосовой чат -->
            <details class="bg-neutral-800/50 rounded-lg border border-neutral-700 overflow-hidden" open>
                <summary class="px-4 py-3 flex justify-between items-center bg-neutral-800 cursor-pointer select-none font-semibold text-white text-sm">
                    Голосовой чат (Voice Chat)
                    <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </summary>
                <div class="p-4 space-y-2">
                    <div id="voiceChatList" class="space-y-2 mb-2"></div>
                    <button id="addVoiceChatBtn" class="w-full flex items-center justify-center gap-2 bg-neutral-800 hover:bg-neutral-700 text-sm p-2 rounded border border-dashed border-neutral-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        Добавить канал
                    </button>
                </div>
            </details>

            <!-- Предметы -->
            <details class="bg-neutral-800/50 rounded-lg border border-neutral-700 overflow-hidden" open>
                <summary class="px-4 py-3 flex justify-between items-center bg-neutral-800 cursor-pointer select-none font-semibold text-white text-sm">
                    Инвентарь (Предметы при спавне)
                    <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </summary>
                <div class="p-4 space-y-2">
                    <div id="itemsList" class="space-y-2 mb-2"></div>
                    <button id="addItemBtn" class="w-full flex items-center justify-center gap-2 bg-neutral-800 hover:bg-neutral-700 text-sm p-2 rounded border border-dashed border-neutral-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        Добавить предмет
                    </button>
                </div>
            </details>

            <!-- Дополнительные функции (Overrides) -->
            <details class="bg-neutral-800/50 rounded-lg border border-neutral-700 overflow-hidden">
                <summary class="px-4 py-3 flex justify-between items-center bg-neutral-800 cursor-pointer select-none font-semibold text-white text-sm">
                    Дополнительные функции (Overrides)
                    <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </summary>
                <div class="p-4 space-y-3" id="overridesContainer">
                    <!-- Генерируется через JS -->
                </div>
            </details>

        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ: КОД -->
        <div class="lg:sticky top-8 h-[calc(100vh-4rem)] flex flex-col">
            <div class="flex items-center justify-between bg-neutral-800 rounded-t-lg border-b border-neutral-700 p-3">
                <span class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500"></span>
                    <span id="fileNameDisplay">CustomClass.cs</span>
                </span>
                <button id="copyBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium transition-colors bg-purple-600 hover:bg-purple-500 text-white">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                    <span id="copyText">Копировать</span>
                </button>
            </div>
            <div class="flex-1 bg-neutral-950 rounded-b-lg border border-t-0 border-neutral-800 overflow-hidden relative">
                <textarea id="codeOutput" readonly class="absolute inset-0 w-full h-full bg-transparent text-gray-300 p-4 font-mono text-xs md:text-sm resize-none focus:outline-none whitespace-pre" spellcheck="false"></textarea>
            </div>
        </div>

    </div>

<script>
    // --- ДАННЫЕ И СПИСКИ ---
    const MODELS = [
        "ply_classD", "ply_guard", "ply_mtf", "ply_chaosInsurgency", "ply_scientist",
        "ply_scp049", "ply_scp096", "ply_scp106", "ply_scp173", "ply_scp0492", "ply_scp939", "ply_scp999"
    ];

    const SPAWN_POINTS = [
        "chaosSpawn", "mtfSpawn", "classDSpawn", "scientistSpawn", "guardSpawn",
        "scp173Spawn", "scp096Spawn", "scp999Spawn", "scp049Spawn", "scp079Spawn", "scp939Spawn"
    ];

    const ITEMS = [
        "Coin", "Cuffer", "Cup", "FirstAid", "FirstAid2", "FlashGrenade", "FragGrenade", "Flashlight", "Radio",
        "SCP035", "SCP420J", "SCP500", "AnalystCard", "AssistantCard", "BreakingCard", "ContainmentSpecialistCard",
        "EngineerCard", "FacilityDirectorCard", "FacilityManagerCard", "FoundationAgentCard", "GuardCard", "JanitorCard",
        "MTFCommanderCard", "MTFOperativeCard", "O5Card", "RecruitCard", "ScientistCard", "SeniorEngineerCard",
        "SeniorScientistCard", "ZoneManagerCard", "Ammo.A9x19", "Ammo.A45", "Ammo.A46x30", "Ammo.A545x39", "Ammo.A556x45",
        "Ammo.A762x39", "AK12", "ASVAL", "CZ75B", "FAL", "G36C", "G56", "M170", "MicroHID", "SR3M", "USP", "VSS"
    ];

    const TEAMS = ["ClassD", "MTF", "SCP", "Spectator"];
    const VOICE_CHANNELS = ["3D", "Intercom", "Spectator", "SCP"];

    // --- СОСТОЯНИЕ ПРИЛОЖЕНИЯ ---
    let state = {
        items: [],
        voiceChats: [{ channel: "3D", active: true }],
        overrides: {
            OnOpenInventory: { enabled: true, type: "bool", value: true, label: "OnOpenInventory (Может открыть инвентарь?)" },
            CanMove: { enabled: false, type: "bool", value: true, label: "CanMove (Может ходить?)" },
            CanInteract: { enabled: false, type: "bool", value: true, label: "CanInteract (Может взаимодействовать?)" },
            IgnoreSCP: { enabled: false, type: "bool", value: false, label: "IgnoreSCP (Игнорирует механики SCP?)" },
            CheckpointPass: { enabled: false, type: "bool", value: false, label: "CheckpointPass (Без карты чекпоинты?)" },
            UserCameraRotation: { enabled: false, type: "bool", value: false, label: "UserCameraRotation (Вращение камеры?)" },
            GetPlayerInfo: { enabled: false, type: "text", value: "Сотрудник клининга", label: "GetPlayerInfo (Текст при взгляде на игрока)" },
            GetDeadInfo: { enabled: false, type: "text", value: "Мертвый уборщик", label: "GetDeadInfo (Текст при взгляде на труп)" },
            GetResistance: { enabled: false, type: "number", value: 1.0, label: "GetResistance (Защита от урона, float)" }
        }
    };

    // --- УТИЛИТЫ ---
    const hexToRgb = (hex) => {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: (parseInt(result[1], 16) / 255).toFixed(3),
            g: (parseInt(result[2], 16) / 255).toFixed(3),
            b: (parseInt(result[3], 16) / 255).toFixed(3)
        } : { r: 1, g: 1, b: 1 };
    };

    const stripHtmlTags = (str) => str.replace(/<\/?[^>]+(>|$)/g, "");

    const el = id => document.getElementById(id);

    // --- ИНИЦИАЛИЗАЦИЯ И РЕНДЕРИНГ ---
    function init() {
        populateSelect('modelSelect', MODELS, 'ply_scientist');
        populateSelect('spawnPointSelect', SPAWN_POINTS, 'scientistSpawn');
        populateSelect('teamIdSelect', TEAMS, 'ClassD');
        
        renderVoiceChats();
        renderItems();
        renderOverrides();
        setupEventListeners();
        
        generateCode(); // Первый запуск
    }

    function populateSelect(id, options, defaultValue) {
        const select = el(id);
        select.innerHTML = options.map(opt => `<option value="${opt}" ${opt === defaultValue ? 'selected' : ''}>${opt}</option>`).join('');
    }

    function setupEventListeners() {
        const inputs = ['namespace', 'className', 'displayName', 'configHpKey', 'defaultHp', 'category', 'icon', 'description', 'modelSelect', 'spawnPointSelect', 'teamIdSelect'];
        
        inputs.forEach(id => {
            el(id).addEventListener('input', generateCode);
        });

        // Синхронизация цветов
        el('hexColorPicker').addEventListener('input', (e) => {
            el('hexColorText').value = e.target.value;
            generateCode();
        });
        el('hexColorText').addEventListener('input', (e) => {
            el('hexColorPicker').value = e.target.value;
            generateCode();
        });

        // Модель -> обновить регдолл
        el('modelSelect').addEventListener('change', (e) => {
            el('ragdollPreview').innerText = e.target.value + "_ragdoll";
        });

        // Кнопки добавления
        el('addVoiceChatBtn').addEventListener('click', () => {
            state.voiceChats.push({ channel: "3D", active: true });
            renderVoiceChats();
            generateCode();
        });

        el('addItemBtn').addEventListener('click', () => {
            state.items.push("Coin");
            renderItems();
            generateCode();
        });

        // Кнопка копирования
        el('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(el('codeOutput').value);
            const btnText = el('copyText');
            btnText.innerText = "Скопировано!";
            el('copyBtn').classList.replace('bg-purple-600', 'bg-green-600');
            el('copyBtn').classList.replace('hover:bg-purple-500', 'hover:bg-green-500');
            setTimeout(() => {
                btnText.innerText = "Копировать";
                el('copyBtn').classList.replace('bg-green-600', 'bg-purple-600');
                el('copyBtn').classList.replace('hover:bg-green-500', 'hover:bg-purple-500');
            }, 2000);
        });
    }

    // --- ДИНАМИЧЕСКИЕ ПАНЕЛИ ---
    function renderVoiceChats() {
        const container = el('voiceChatList');
        container.innerHTML = '';
        state.voiceChats.forEach((vc, index) => {
            const div = document.createElement('div');
            div.className = "flex items-center gap-2 bg-neutral-800 p-2 rounded border border-neutral-700";
            
            const select = document.createElement('select');
            select.className = "bg-neutral-900 border border-neutral-600 rounded p-1.5 text-sm flex-1 text-white outline-none focus:border-purple-500";
            select.innerHTML = VOICE_CHANNELS.map(c => `<option value="${c}" ${c === vc.channel ? 'selected' : ''}>${c}</option>`).join('');
            select.addEventListener('change', (e) => { state.voiceChats[index].channel = e.target.value; generateCode(); });

            const label = document.createElement('label');
            label.className = "flex items-center gap-2 text-sm text-gray-300 cursor-pointer";
            const checkbox = document.createElement('input');
            checkbox.type = "checkbox";
            checkbox.checked = vc.active;
            checkbox.className = "rounded text-purple-500 bg-neutral-900 border-neutral-600 focus:ring-purple-500";
            checkbox.addEventListener('change', (e) => { state.voiceChats[index].active = e.target.checked; generateCode(); });
            
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(" Включен"));

            const delBtn = document.createElement('button');
            delBtn.className = "text-red-400 hover:text-red-300 p-1 ml-1";
            delBtn.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`;
            delBtn.addEventListener('click', () => { state.voiceChats.splice(index, 1); renderVoiceChats(); generateCode(); });

            div.appendChild(select);
            div.appendChild(label);
            div.appendChild(delBtn);
            container.appendChild(div);
        });
    }

    function renderItems() {
        const container = el('itemsList');
        container.innerHTML = '';
        state.items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = "flex gap-2";
            
            const select = document.createElement('select');
            select.className = "flex-1 bg-neutral-800 border border-neutral-700 rounded p-2 text-sm text-white outline-none focus:border-purple-500";
            select.innerHTML = ITEMS.map(i => `<option value="${i}" ${i === item ? 'selected' : ''}>${i}</option>`).join('');
            select.addEventListener('change', (e) => { state.items[index] = e.target.value; generateCode(); });

            const delBtn = document.createElement('button');
            delBtn.className = "bg-red-900/50 text-red-400 hover:bg-red-900 px-3 py-2 rounded border border-red-800/50 transition-colors flex items-center justify-center";
            delBtn.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`;
            delBtn.addEventListener('click', () => { state.items.splice(index, 1); renderItems(); generateCode(); });

            div.appendChild(select);
            div.appendChild(delBtn);
            container.appendChild(div);
        });
    }

    function renderOverrides() {
        const container = el('overridesContainer');
        container.innerHTML = '';
        Object.keys(state.overrides).forEach(key => {
            const data = state.overrides[key];
            const div = document.createElement('div');
            div.className = "flex items-center justify-between p-2 rounded bg-neutral-900/50 border border-neutral-800 gap-4 flex-wrap md:flex-nowrap";
            
            const labelWrapper = document.createElement('label');
            labelWrapper.className = "flex items-center gap-2 cursor-pointer select-none text-sm text-gray-300 min-w-max";
            
            const checkbox = document.createElement('input');
            checkbox.type = "checkbox";
            checkbox.checked = data.enabled;
            checkbox.className = "rounded border-neutral-600 text-purple-500 bg-neutral-800";
            
            labelWrapper.appendChild(checkbox);
            labelWrapper.appendChild(document.createTextNode(data.label));

            div.appendChild(labelWrapper);

            // Контейнер значения
            const valContainer = document.createElement('div');
            valContainer.className = "flex-1 flex justify-end min-w-[120px]";
            
            // Функция обновления вида инпута
            const updateInputVisibility = () => {
                valContainer.innerHTML = '';
                if(data.enabled) {
                    if(data.type === 'bool') {
                        const sel = document.createElement('select');
                        sel.className = "bg-neutral-800 border border-neutral-700 rounded p-1 text-xs outline-none text-white";
                        sel.innerHTML = `<option value="true" ${data.value ? 'selected':''}>true</option><option value="false" ${!data.value ? 'selected':''}>false</option>`;
                        sel.addEventListener('change', e => { data.value = e.target.value === 'true'; generateCode(); });
                        valContainer.appendChild(sel);
                    } else {
                        const inp = document.createElement('input');
                        inp.type = data.type;
                        if(data.type === 'number') inp.step = "0.1";
                        inp.value = data.value;
                        inp.className = "bg-neutral-800 border border-neutral-700 rounded p-1 px-2 text-xs outline-none w-full max-w-[150px] text-white";
                        inp.addEventListener('input', e => { 
                            data.value = data.type === 'number' ? (parseFloat(e.target.value) || 0) : e.target.value; 
                            generateCode(); 
                        });
                        valContainer.appendChild(inp);
                    }
                }
            };
            
            updateInputVisibility();
            
            checkbox.addEventListener('change', e => {
                data.enabled = e.target.checked;
                updateInputVisibility();
                generateCode();
            });

            div.appendChild(valContainer);
            container.appendChild(div);
        });
    }

    // --- ГЕНЕРАЦИЯ КОДА ---
    function generateCode() {
        // Сбор данных из DOM
        const v = {
            namespace: el('namespace').value || "PluginExample",
            className: el('className').value || "CustomClass",
            displayName: el('displayName').value, // с тегами для ShowClass
            cleanName: stripHtmlTags(el('displayName').value), // без тегов для InitHealth
            configHpKey: el('configHpKey').value,
            defaultHp: el('defaultHp').value,
            hexColor: el('hexColorText').value,
            category: el('category').value,
            description: el('description').value.replace(/\n/g, '\\n'), // экранирование переносов
            icon: el('icon').value,
            model: el('modelSelect').value,
            spawnPoint: el('spawnPointSelect').value,
            teamId: el('teamIdSelect').value
        };

        el('fileNameDisplay').innerText = v.className + ".cs";
        const rgb = hexToRgb(v.hexColor);
        
        // Items
        const itemsCode = state.items.map(item => `                player.GiveItem("${item}");`).join('\n');
        
        // Voice Chats
        const voiceCode = state.voiceChats.length > 0 
            ? `PlayerUtilities.SetVoiceChat(${state.voiceChats.map(vc => `("${vc.channel}", ${vc.active ? 'true' : 'false'})`).join(', ')});`
            : "";

        // Overrides
        let ovrCode = "";
        const ovr = state.overrides;
        
        if (ovr.OnOpenInventory.enabled) ovrCode += `\n        public override bool OnOpenInventory()\n        {\n            return ${ovr.OnOpenInventory.value ? 'true' : 'false'};\n        }\n`;
        if (ovr.CanMove.enabled) ovrCode += `\n        public override bool CanMove()\n        {\n            return ${ovr.CanMove.value ? 'true' : 'false'};\n        }\n`;
        if (ovr.UserCameraRotation.enabled) ovrCode += `\n        public override bool UserCameraRotation()\n        {\n            return ${ovr.UserCameraRotation.value ? 'true' : 'false'};\n        }\n`;
        if (ovr.GetPlayerInfo.enabled) ovrCode += `\n        public override string GetPlayerInfo(HitBox box)\n        {\n            return "${ovr.GetPlayerInfo.value}";\n        }\n`;
        if (ovr.GetDeadInfo.enabled) ovrCode += `\n        public override string GetDeadInfo(DeadBox box)\n        {\n            return "${ovr.GetDeadInfo.value}";\n        }\n`;
        if (ovr.GetResistance.enabled) ovrCode += `\n        public override float GetResistance()\n        {\n            return ${ovr.GetResistance.value}f;\n        }\n`;
        if (ovr.IgnoreSCP.enabled) ovrCode += `\n        public override bool IgnoreSCP()\n        {\n            return ${ovr.IgnoreSCP.value ? 'true' : 'false'};\n        }\n`;
        if (ovr.CheckpointPass.enabled) ovrCode += `\n        public override bool CheckpointPass()\n        {\n            return ${ovr.CheckpointPass.value ? 'true' : 'false'};\n        }\n`;
        if (ovr.CanInteract.enabled) ovrCode += `\n        public override bool CanInteract()\n        {\n            return ${ovr.CanInteract.value ? 'true' : 'false'};\n        }\n`;

        const finalCode = `using System.Collections.Generic;
using UnityEngine;
using Akequ.Base;
using System.Linq;

namespace ${v.namespace}
{
    public class ${v.className} : PlayerClass
    {
        public override void Init()
        {
            player.InitHealth((uint)Config.GetInt("${v.configHpKey}", ${v.defaultHp}), new UnityEngine.Color(${rgb.r}f, ${rgb.g}f, ${rgb.b}f, 1f), "${v.cleanName}");
            player.SetHitbox(new Vector3(0.8f, 1.8f, 0.8f), Vector3.zero);
            
            if (player.isLocalPlayer)
            {
                player.PlayBellSound(1);
                UIManager.SetMobileButtons(new List<string>() { "Move", "Rotate", "Pause", "PlayerList", "Interact", "Jump", "Run", "Inventory", "Voice", "Crouch" });
                
                TransitionManager.ShowClass("${v.hexColor.toUpperCase()}", "${v.displayName}", "${v.description}", "${v.category}", "${v.icon}");
                
                ${voiceCode}
            }
            
            playerModel = player.SpawnHumanoidModel("${v.model}");
            playerModel.transform.localPosition = new Vector3(0f, -0.83f, 0f);
            PlayerUtilities.SpawnHitboxes(player, playerModel);

            if (player.isServer)
            {
                var points = player.GetSpawnPoints("${v.spawnPoint}");
                var point = points.ElementAt(Random.Range(0, points.Count));
                player.Teleport(point.Key.position + new Vector3(0f, 1.25f, 0f), point.Value);

${itemsCode}
            }
        }

        public override void OnStop()
        {
            if (playerModel != null)
            {
                PlayerUtilities.SpawnRagdoll(player, playerModel);
                GameObject.Destroy(playerModel);
            }
            else
            {
                PlayerUtilities.SpawnRagdoll(player, "${v.model}_ragdoll");
            }
        }

        public override string GetName()
        {
            return "${v.cleanName}";
        }

        public override string GetTeamID()
        {
            return "${v.teamId}";
        }

        public override string GetClassColor()
        {
            return "${v.hexColor.replace('#', '').toUpperCase()}";
        }
${ovrCode}
    }
}`;
        el('codeOutput').value = finalCode;
    }

    // Запуск приложения
    document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
